<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#0a0a0a;color:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .box{text-align:center;padding:32px;width:min(420px,92vw)}
  .logo{font-weight:800;letter-spacing:.4em;font-size:15px;margin-bottom:54px}
  h1{font-size:clamp(38px,7vw,64px);font-weight:800;letter-spacing:.1em;margin-bottom:14px}
  .hint{color:#8a8a8a;font-size:12px;letter-spacing:.4em;margin-bottom:44px}
  form{display:flex;flex-direction:column;gap:16px}
  input{
    background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:2px;
    color:#f5f5f5;font-size:16px;letter-spacing:.15em;text-align:center;
    padding:16px 18px;outline:none;transition:border-color .25s;
  }
  input:focus{border-color:#f5f5f5}
  button{
    background:#f5f5f5;color:#0a0a0a;border:none;border-radius:2px;cursor:pointer;
    font-size:13px;letter-spacing:.45em;font-weight:700;padding:16px;
    transition:opacity .25s;
  }
  button:hover{opacity:.85}
  button:disabled{opacity:.5;cursor:wait}
  .err{color:#c8c8c8;font-size:12px;letter-spacing:.3em;min-height:20px;margin-top:4px}
  .remember{display:flex;align-items:center;justify-content:center;gap:10px;color:#8a8a8a;font-size:12px;letter-spacing:.25em;cursor:pointer;user-select:none}
  .remember input{width:14px;height:14px;accent-color:#f5f5f5;padding:0}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  .foot{position:fixed;bottom:26px;left:0;right:0;text-align:center;color:#555;font-size:10px;letter-spacing:.35em}
</style>
</head>

  var s = atob(b64), n = s.length, a = new Uint8Array(n);
  for(var i=0;i<n;i++) a[i] = s.charCodeAt(i);

}

  f.addEventListener('submit', async function(e){
    e.preventDefault();
    err.textContent = ''; btn.disabled = true; btn.textContent = '解密中…';
    try{
      var html = await unlock(pw.value);
      try{
        if(rm.checked) localStorage.setItem('raemyn_pw', pw.value);
        else localStorage.removeItem('raemyn_pw');
      }catch(e){}
      document.open(); document.write(html); document.close();
    }catch(exc){
      btn.disabled = false; btn.textContent = '进入 ENTER';
      err.textContent = '密码错误 · TRY AGAIN';
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      pw.select();
    }
  });
  pw.focus();
})();
</script>
